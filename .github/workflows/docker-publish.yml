name: Publish

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - cpak.json
      - .github/workflows/docker-publish.yml
  schedule:
    - cron: '40 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  attestations: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/containerpak/sdk-node-lts
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify SDK exports
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" ghcr.io/containerpak/sdk-node-lts:main node --version
            docker run --rm --platform "$platform" ghcr.io/containerpak/sdk-node-lts:main npm --version
            docker run --rm --platform "$platform" ghcr.io/containerpak/sdk-node-lts:main npx --version
            docker run --rm --platform "$platform" ghcr.io/containerpak/sdk-node-lts:main corepack --version
          done
